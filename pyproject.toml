[project]
name = "oauthclientbridge"
description = "Bridge OAuth2 Authorization Code Grants to Clients Grants"
readme = "README.md"
requires-python = "<3.13,>=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Thomas Adamcik", email = "thomas@adamcik.no" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "Flask==3.1.3",
  "Jinja2==3.1.6",
  "anyio==4.16.0",
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-instrumentation-asgi==0.66b2",
  "opentelemetry-instrumentation-flask==0.66b2",
  "opentelemetry-instrumentation-httpx==0.66b2",
  "opentelemetry-instrumentation-logging==0.66b2",
  "opentelemetry-instrumentation-requests==0.66b2",
  "opentelemetry-instrumentation-sqlite3==0.66b2",
  "opentelemetry-instrumentation-system-metrics==0.66b2",
  "opentelemetry-sdk==1.45.2",
  "prometheus-client==0.26.0",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.32",
  "requests==2.34.2",
  "starlette==1.10.0",
  "structlog==26.1.0",
  "typer==0.27.3",
  "uvicorn==0.54.0",
  "werkzeug==3.1.9",
]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/adamcik/oauthclientbridge"

[project.scripts]
oauthclientbridge = "oauthclientbridge.cli:main"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "sentry" },
  { include-group = "test" },
  { include-group = "typing" },
]
lint = ["ruff==0.17.3"]
sentry = ["sentry-sdk[opentelemetry]==2.73.0", "structlog-sentry==2.2.1"]
test = [
  "pytest",
  "pytest-cov",
  "pytest-freezer",
  "pytest-xdist",
  "requests_mock",
  { include-group = "sentry" },
]
typing = [
  "basedpyright==1.40.2",
  "types-requests",
  { include-group = "sentry" },
]

[build-system]
requires = ["hatch-vcs==0.5.0", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = [
  "src/oauthclientbridge",
  "src/pytest_otel_capture",
  "src/pytest_sentry_capture",
]

[tool.pyright]
include = ["src/oauthclientbridge"]
stubPath = "typings"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-n auto"
filterwarnings = [
  "ignore:The '__version__' attribute is deprecated and will be removed in Flask 3\\.2.*:DeprecationWarning:opentelemetry\\.instrumentation\\.flask",
]

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
  # These rules conflict with ruff format, which is the formatting authority.
  "COM812",  # missing-trailing-comma
  "ISC001",  # single-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
known-local-folder = ["src"]

[tool.uv]
required-version = ">=0.7.20"
